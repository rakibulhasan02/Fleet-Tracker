<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Tracker - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <h2>Fleet Management Dashboard</h2>
    <div>
      <span id="userInfo" style="margin-right: 15px;"></span>
      <button id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h3>Add New Vehicle</h3>
      <form id="vehicleForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
        <input type="text" id="vName" placeholder="Vehicle Name" required>
        <input type="text" id="vPlate" placeholder="Plate Number" required>
        <input type="text" id="vModel" placeholder="Model Year/Type" required>
        <input type="number" id="vMileage" placeholder="Mileage (km)" required>
        <select id="vStatus">
          <option value="Active">Active</option>
          <option value="In Maintenance">In Maintenance</option>
          <option value="Out of Service">Out of Service</option>
        </select>
        <input type="text" id="vDriver" placeholder="Assigned Driver Name">
        <button type="submit" class="btn" style="grid-column: span 2;">Add Vehicle</button>
      </form>
    </div>

    <div class="card">
      <h3>Registered Fleet</h3>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Plate Number</th>
            <th>Model</th>
            <th>Mileage</th>
            <th>Status</th>
            <th>Driver</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="vehicleTableBody"></tbody>
      </table>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
