<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetTracker - Smart Fleet Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <div class="container auth-container">
    <div class="brand">
      <div class="brand-logo">🚚</div>
      <h1>Fleet<span>Tracker</span></h1>
      <p class="brand-tagline">Smart Fleet Management System</p>
      <p class="brand-desc">Track vehicles, drivers, fuel, maintenance and documents in one place.</p>
      <div class="brand-chips">
        <span>🚗 Vehicles</span>
        <span>🧑‍✈️ Drivers</span>
        <span>⛽ Fuel</span>
        <span>🛠️ Maintenance</span>
        <span>📄 Documents</span>
      </div>
    </div>
    <div class="card" id="loginCard">
            <h2>Welcome back 👋</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>
      <p style="margin-top: 1rem; text-align: center;">
        Don't have an account? <a href="#" id="showRegister">Register</a>
      </p>
    </div>

    <div class="card hidden" id="registerCard">
            <h2>Create your account</h2>
      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" required>
        </div>
        <div class="form-group">
          <label>Role</label>
                    <select id="regRole">
            <option value="Driver">Driver</option>
            <option value="Owner">Owner</option>
            <option value="Mechanic">Mechanic</option>
          </select>
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
      <p style="margin-top: 1rem; text-align: center;">
        Already have an account? <a href="#" id="showLogin">Login</a>
      </p>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
