<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Tracker - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container" style="max-width: 400px; margin-top: 5rem;">
    <!-- Login Card -->
    <div class="card" id="loginCard">
      <h2>Fleet Tracker Login</h2>
      <p style="margin-bottom: 1rem; color: #666;">Enter your credentials to access the portal.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" required placeholder="user@fleet.com">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
      <p style="margin-top: 1rem; text-align: center;">
        Don't have an account? <a href="#" id="showRegister">Register here</a>
      </p>
    </div>

    <!-- Registration Card -->
    <div class="card hidden" id="registerCard">
      <h2>Create Account</h2>
      <p style="margin-bottom: 1rem; color: #666;">Register a new user role in the fleet system.</p>
      <form id="registerForm">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" required placeholder="john@fleet.com">
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label for="regRole">User Role</label>
          <select id="regRole">
            <option value="Driver">Driver</option>
            <option value="Admin">Admin / Fleet Manager</option>
          </select>
        </div>
        <button type="submit" class="btn">Register Account</button>
      </form>
      <p style="margin-top: 1rem; text-align: center;">
        Already registered? <a href="#" id="showLogin">Sign in here</a>
      </p>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
